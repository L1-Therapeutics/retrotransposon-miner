name: Continuous Integration & Parity Verification

on:
  push:
    branches: [ main, fix/*, feature/* ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y samtools bedtools bwa htslib-tools

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pysam hypothesis anyio

    - name: Run Pytest Suite
      run: |
        pytest -v

    - name: Run One-Pass Extraction Benchmark
      run: |
        python3 benchmarks/benchmark_one_pass_extraction.py --num-reads 10000 --json > benchmark_results.json
        cat benchmark_results.json

    - name: Upload Benchmark Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: benchmark-results-py${{ matrix.python-version }}
        path: benchmark_results.json
