name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run unit tests
        run: pytest -v tests/

      - name: Run benchmark
        run: |
          python benchmarks/benchmark_one_pass_extraction.py \
            --num-reads 1000 \
            --json > benchmark_results.json
        continue-on-error: true

      - name: Generate benchmark report
        if: github.event_name == 'pull_request'
        run: |
          python scripts/generate_benchmark_report.py \
            --json-input benchmark_results.json \
            --markdown-out benchmark_report.md

      - name: Comment benchmark report on PR
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment 39 \
            --body-file benchmark_report.md \
            --repo ${{ github.repository }}
