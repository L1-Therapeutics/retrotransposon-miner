name: Continuous Integration & Parity Assurance

on:
  push:
    branches: [ main, fix/*, feature/* ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y samtools bedtools bwa tabix

    - name: Install Project & Test Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
        pip install pytest-cov hypothesis anyio

    - name: Run Full Pytest Suite with Coverage
      run: |
        pytest --cov=src --cov-report=xml --cov-report=term -v

    - name: Generate Synthetic BAM
      run: |
        python3 scripts/generate_synthetic_bam.py \
          --output /tmp/parity_synthetic.bam \
          --num-reads 1000 \
          --seed 42 \
          --n-l1-insertions 2 \
          --n-alu-insertions 2

    - name: Run Callset Parity Verification
      run: |
        python3 scripts/compare_callset_parity.py \
          --baseline /tmp/parity_baseline.tsv \
          --candidate /tmp/parity_candidate.tsv \
          --json

    - name: Run One-Pass Extraction Benchmark
      run: |
        python3 benchmarks/benchmark_one_pass_extraction.py --num-reads 10000 --json > benchmark_results.json
        cat benchmark_results.json

    - name: Upload Coverage Report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: coverage-report-py${{ matrix.python-version }}
        path: coverage.xml

    - name: Upload Benchmark Artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: benchmark-results-py${{ matrix.python-version }}
        path: benchmark_results.json
