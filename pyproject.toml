[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "retrotransposon-miner"
version = "0.1.0"
description = "High-sensitivity retrotransposon insertion calling scaffold"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
  { name = "retrotransposon-miner contributors" }
]
dependencies = [
  "click>=8.1",
  "pysam>=0.22",
  "pandas>=2.2",
  "pyarrow>=16",        # implicit pandas Parquet engine
  "numpy>=1.26",
  "matplotlib>=3.9",   # read_architecture.py plots
  "biopython>=1.84",
  "pyfaidx>=0.8",
  "intervaltree>=3.1",
  "pyyaml>=6.0",        # scripts/download_public_data.py
  "rich>=13.7",
]

[project.scripts]
rtm = "retro_miner.cli:cli"

[tool.ruff]
target-version = "py311"
line-length    = 120
exclude        = ["scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
  "E501",   # long lines are common in generated/table-heavy modules
  "E731",   # lambda aliases (s = lambda ...) are intentional shorthand in large pipeline functions
  "E402",   # module-level imports after sys.path manipulation are intentional in standalone scripts
  "BLE001", # blind Exception catches are intentional in data-download / retry utilities
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts   = ["-q", "--tb=short"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
