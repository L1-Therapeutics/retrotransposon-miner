  # -------------------------------------------------------------------------
  # Mouse (Mus musculus). Selected with --references mm39 and/or mm10.
  # Default --references still materializes only hg19, hg38, and hs1.
  # mm39 / GRCm39 is the current reference. mm10 is the Sugo 2025 and
  # Mouse Genomes Project coordinate system. Chains place mm9 (Hazen 2016)
  # and mm10 calls onto mm39.
  # -------------------------------------------------------------------------
  - id: mm39_reference_fasta
    category: reference
    description: UCSC GRCm39/mm39 analysis FASTA (chr names, soft-masked)
    source: UCSC
    url: https://hgdownload.soe.ucsc.edu/goldenPath/mm39/bigZips/mm39.fa.gz
    target_path: reference/mm39/mm39.fa.gz
    required: true

  - id: mm10_reference_fasta
