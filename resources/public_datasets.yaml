# Paired ENA FASTQs for the two somatic-neuron cloning papers.
# Expanded to category test_fastq (_r1/_r2). Omitted from --references mm39
# unless --include-mouse-test-fastqs is set, then streamed to S3
# (test_data/mouse_wgs is excluded from the local cache sync).
#
# Hazen et al. Neuron 2016, BioProject PRJNA312530. HiSeq 2000, 100 bp,
# authors aligned to mm9. Germline controls are matched thymus or spleen,
# not test genomes. C1 was sequenced but left out of the paper mutation table.
# Validated somatic L1 insertions are in supplemental Table S8 (mm9). The
# smallest autosome for a later chromosome smoke test is chr19; pick the
# clone Table S8 places an insertion on.
#
# Sugo et al. PNAS 2025, BioProject PRJDB20767. PCR-free NovaSeq, 150 bp,
# ~350 bp insert, authors aligned to mm10. No donor-tissue genome: sister
# clones from the same mouse are the control for one another. Reported
# about 1.4 LINE/SINE insertions per wild-type cell.
mouse_wgs_libraries:
